<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMM — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: #060d1f;
    color: #e8edf5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,127,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,127,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    opacity: 0.18;
  }
  .orb-1 { width: 400px; height: 400px; background: #4a7fff; top: -100px; right: -80px; }
  .orb-2 { width: 300px; height: 300px; background: #7c5cfc; bottom: -80px; left: -60px; }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%;
    max-width: 400px;
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4a7fff, #7c5cfc);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
  .logo-sub  { font-size: 11px; color: #6b7fa3; letter-spacing: .04em; text-transform: uppercase; }

  h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #6b7fa3; margin-bottom: 32px; }

  .error-msg {
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.25);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: #ff9999;
    margin-bottom: 20px;
  }

  .field { margin-bottom: 18px; }
  label  { display: block; font-size: 12px; font-weight: 600; color: #8899bb; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 8px; }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #e8edf5;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: #4a7fff; background: rgba(74,127,255,0.06); }
  input::placeholder { color: #3a4e6e; }

  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #4a7fff, #7c5cfc);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .2s;
    letter-spacing: .02em;
  }
  .btn:hover { opacity: .88; }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">💰</div>
    <div>
      <div class="logo-text">NMM</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
  </div>

  <h2>Welcome back</h2>
  <p class="sub">Sign in to your admin dashboard</p>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit">Sign In →</button>
  </form>
</div>
</body>
</html>
